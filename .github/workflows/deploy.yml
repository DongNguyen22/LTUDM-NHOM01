name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feature/server" ]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'pom.xml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'pom.xml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. Tạo file cấu hình từ GitHub Secret trước khi đóng gói JAR
      - name: Inject application.properties
        env:
          APP_PROPERTIES: ${{ secrets.APPLICATION_PROPERTIES }}
        run: |
          mkdir -p server/src/main/resources
          printf "%s\n" "$APP_PROPERTIES" > server/src/main/resources/application.properties

      # 2. GitHub Actions gánh việc build trên máy 16GB RAM
      - name: Build Fat JAR với Maven
        run: mvn clean package -DskipTests

      # 3. Đẩy file server.jar sang VPS (tự động chạy cả khi push hoặc tạo pull request vào server)
      - name: Copy server.jar lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          source: "server/target/server.jar"
          target: "~/LTUDM-NHOM01/"
          strip_components: 2

      # 4. SSH vào restart service
      - name: Restart Server trên VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            echo "${{ secrets.AZURE_PASSWORD }}" | sudo -S systemctl enable music-server
            echo "${{ secrets.AZURE_PASSWORD }}" | sudo -S systemctl restart music-server
            echo "${{ secrets.AZURE_PASSWORD }}" | sudo -S systemctl status music-server --no-pager