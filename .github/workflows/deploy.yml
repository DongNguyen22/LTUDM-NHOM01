name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feature/server" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. GitHub Actions gánh việc build trên máy 16GB RAM
      - name: Build Fat JAR với Maven
        run: mvn clean package -DskipTests

      # 2. Đẩy file server.jar sang VPS (chỉ chạy khi push lên main/master)
      - name: Copy server.jar lên VPS
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          source: "server/target/server.jar"
          target: "~/LTUDM-NHOM01/"
          strip_components: 2

      # 3. SSH vào chỉ để restart service (chạy siêu nhẹ, không tốn tài nguyên VPS)
      - name: Restart Server trên VPS
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            sudo systemctl enable music-server
            sudo systemctl restart music-server
            sudo systemctl status music-server --no-pager